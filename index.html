<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%90%8D</text></svg>">

<!-- Bootstrap 5 (CSS) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons (SVG/font vector icons used for the audio controls) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Psychedelic neon-retro theme (loaded after Bootstrap so it can override it) -->
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="app-wrap d-flex flex-column gap-3">

  <!-- ============ HEADER: title + score / high score + audio toggle ============ -->
  <header class="d-flex align-items-center justify-content-between">
    <h1 class="brand h3 mb-0">🐍 Snake</h1>
    <div class="d-flex gap-2 align-items-center">
      <div class="panel stat-pill">
        <span class="label">Score</span>
        <span class="value" id="scoreValue">0</span>
      </div>
      <div class="panel stat-pill">
        <span class="label">Best</span>
        <span class="value" id="highScoreValue">0</span>
      </div>
      <button id="btnAudioToggle" class="btn btn-outline-light audio-toggle-btn" type="button"
              data-bs-toggle="collapse" data-bs-target="#audioPanel"
              aria-expanded="false" aria-controls="audioPanel" aria-label="Audio settings">
        <i class="bi bi-soundwave" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <!-- ============ AUDIO SETTINGS: music / SFX volume + mute ============ -->
  <div class="collapse" id="audioPanel">
    <div class="panel audio-panel p-3 d-flex flex-column gap-3">
      <div class="audio-row">
        <div class="audio-row-label">
          <button id="btnMusicMute" class="btn btn-outline-light mute-btn" type="button" aria-label="Toggle music mute">
            <i class="bi bi-music-note-beamed" aria-hidden="true"></i>
          </button>
          <span>Music</span>
        </div>
        <input type="range" id="musicVolumeSlider" class="form-range neon-range" min="0" max="100" value="50" aria-label="Music volume">
      </div>
      <div class="audio-row">
        <div class="audio-row-label">
          <button id="btnSfxMute" class="btn btn-outline-light mute-btn" type="button" aria-label="Toggle sound effects mute">
            <i class="bi bi-volume-up-fill" aria-hidden="true"></i>
          </button>
          <span>SFX</span>
        </div>
        <input type="range" id="sfxVolumeSlider" class="form-range neon-range" min="0" max="100" value="70" aria-label="Sound effects volume">
      </div>
    </div>
  </div>

  <!-- ============ CONTROLS: start / pause / restart / difficulty ============ -->
  <div class="panel p-2 d-flex flex-wrap align-items-center gap-2 justify-content-between">
    <div class="btn-group">
      <button id="btnStart" class="btn btn-accent">Start</button>
      <button id="btnPause" class="btn btn-outline-light" disabled>Pause</button>
      <button id="btnRestart" class="btn btn-outline-light">Restart</button>
    </div>
    <select id="difficultySelect" class="form-select form-select-sm w-auto bg-dark text-light border-secondary">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <!-- ============ GAME BOARD ============ -->
  <div class="board-frame">
    <canvas id="gameCanvas"></canvas>

    <div id="overlay" class="board-overlay">
      <h2 id="overlayTitle">Ready?</h2>
      <p id="overlayMessage">Press Start, or any arrow key, to begin.</p>
      <button id="overlayBtn" class="btn btn-accent px-4">Start</button>
    </div>
  </div>

  <!-- ============ MOBILE TOUCH D-PAD ============ -->
  <div class="d-md-none d-flex justify-content-center pt-1">
    <div class="dpad">
      <button class="btn btn-outline-light dpad-up" data-dir="up" aria-label="Up">▲</button>
      <button class="btn btn-outline-light dpad-left" data-dir="left" aria-label="Left">◀</button>
      <button class="btn btn-outline-light dpad-right" data-dir="right" aria-label="Right">▶</button>
      <button class="btn btn-outline-light dpad-down" data-dir="down" aria-label="Down">▼</button>
    </div>
  </div>

  <!-- ============ INSTRUCTIONS ============ -->
  <p class="kbd-hint text-center text-secondary small mb-0">
    Move: <kbd>↑↓←→</kbd> / <kbd>WASD</kbd> &nbsp; Pause: <kbd>Space</kbd> / <kbd>P</kbd> &nbsp; Restart: <kbd>R</kbd>
  </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
